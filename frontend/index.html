<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1f1f1" />
    <meta name="description" content="Secure Media Player with JWT Token Validation - CloudFront and Lambda@Edge" />

    <!-- Fonts: Fraunces (display), Hanken Grotesk (body), IBM Plex Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet">

    <title>Secure Media Player</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Video.js JS (exposes the global `videojs` used by src/components/player/VideoPlayer.jsx) -->
    <script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>

    <!-- HLS quality selector: adds a control-bar menu to switch renditions
         (Auto + each bitrate). Reads the quality levels VHS already exposes.
         Optional — if it fails to load, the player still works (auto quality). -->
    <script src="https://unpkg.com/videojs-http-source-selector@1.1.6/dist/videojs-http-source-selector.min.js"></script>

    <!-- App entry (Vite) -->
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
